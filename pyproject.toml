[project]
name = "phishbench"
version = "0.1.0"
description = "Benchmark for decision models that find phishing pages from one page snapshot."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
phishbench = "phishbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
charts = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
